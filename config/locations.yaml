# config/locations.yaml — sites of interest
#
# Coordinates marked `approx: true` are starting values from PLAN.md Part B §2.
# They MUST be replaced in P1 with real lat/lon parsed from the CPCB station
# list PDF (WQMN_list.pdf). Do not trust an approx coordinate for any distance
# or routing decision until confirmed.

crs: EPSG:4326  # WGS84 lat/lon in degrees

# --- CPCB river monitoring stations (real coords from WQMN_list.pdf, P1) ---
# cpcb_station_code links each site to the CPCB NWMP station list.
river_stations:
  - site_id: cpcb_pandu
    name: "BRAHAMPUTRA AT PANDU, ASSAM"
    cpcb_station_code: "1031"
    lat: 26.176
    lon: 91.68375
    role: city_reach
    approx: false
  - site_id: cpcb_chandrapur
    name: "BRAHMAPUTRA RIVER AT CHANDRAPUR, GUWAHATI, ASSAM"
    cpcb_station_code: "2064"
    lat: 26.24776
    lon: 91.918205
    role: upstream_east_of_city
    approx: false
  - site_id: cpcb_bharalu
    name: "BHARALU RIVER AT GUWAHATI, ASSAM"
    cpcb_station_code: "1528"
    lat: 26.167661
    lon: 91.765289
    role: urban_tributary
    approx: false
  - site_id: cpcb_kacharighat
    name: "BRAHMPUTRA RIVER NEAR WATER INTAKE POINT AT KACHARIGHAT"
    cpcb_station_code: "2069"
    lat: 26.190372
    lon: 91.745589
    role: city_intake_reach
    approx: false
  - site_id: cpcb_dibrugarh
    name: "BRAHAMPUTRA AT DIBRUGARH, ASSAM"
    cpcb_station_code: "1030"
    lat: 27.510417
    lon: 94.953333
    role: far_upstream
    approx: false
  - site_id: cpcb_dhubri
    name: "BRAHMAPUTRA RIVER AT DHUBRI, ASSAM"
    cpcb_station_code: "2066"
    lat: 26.015519
    lon: 89.993294
    role: downstream_west_of_city
    approx: false
  - site_id: cpcb_bogibeel
    name: "BRAHAMPUTRA RIVER AT BOGIBEEL BRIDGE, DIBRUGARH"
    cpcb_station_code: "3781"
    lat: 27.412578
    lon: 94.757007
    role: far_upstream
    approx: false

# --- Our user's intake (confirm exact location with WTP chemist) ---
intake:
  - site_id: iitg_intake
    name: "IITG raw-water intake (barge)"
    lat: 26.19   # confirm with WTP chemist
    lon: 91.69   # confirm with WTP chemist
    role: campus_intake
    approx: true
    note: "Barge intake in low-water months (Dec-Mar). Location to be confirmed."

# --- Upstream catchment points for rainfall features (Open-Meteo, P2) ---
rain_points:
